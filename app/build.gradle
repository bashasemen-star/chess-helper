plugins {
    id 'com.android.application'
}

android {
    namespace 'com.humanhelper.chesshelper'
    compileSdk 34

    defaultConfig {
        applicationId "com.humanhelper.chesshelper"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.bhlangonijr:chesslib:1.3.7'
}
